# 적용 순서 (이 파일 자체는 자동으로 읽히지 않습니다.)
# 1. backend/com/kh/spring12 아래 Java 파일을 Spring Boot src/main/java/com/kh/spring12에 복사합니다.
#    entity/Station.java, repo/StationRepository.java, controller/StationRestController.java는 교체합니다.
#    service/StationSearchService.java, service/StationSeedService.java,
#    config/StationSeedRunner.java는 추가하거나 기존 적용용 파일을 교체합니다.
# 2. station-seed.tsv와 station-seed-source.json을 Spring Boot src/main/resources에 복사합니다.
# 3. 기존 application.properties에 아래 두 설정만 추가/수정한 후 재시작합니다.
#    기존 DB 연결 설정을 지우거나 application.properties 전체를 교체하지 마세요.
#    개발 DB에서 기존 테이블을 유지하면서 latitude, longitude 컬럼을 추가하는 설정입니다.
#    ddl-auto=create/create-drop은 기존 데이터를 삭제하므로 사용하지 않습니다.
spring.jpa.hibernate.ddl-auto=update
station.seed.enabled=true
# 4. 서버 로그에 "지하철 1~9호선 데이터 적용 완료"가 나오면
#    station.seed.enabled=false로 바꾸세요. 계속 true이면 삭제한 기본 역이 재시작 시 복원됩니다.
#    스키마 자동 변경을 원하지 않으면 적용 후 ddl-auto를 기존 설정으로 되돌리세요.
# 5. GET http://localhost:8080/api/v1/station/ 응답에 latitude, longitude가 있는지 확인합니다.
#    GET http://localhost:8080/api/v1/station/search?keyword=강남 검색도 확인합니다.
# 6. React 화면에서 전체보기를 누르면 목록과 지도 데이터가 함께 갱신됩니다.
# 페이지당 10개 표시는 React에서 서버 응답 순서를 유지하며 slice로 처리합니다.
# 기존 GET 목록/검색 응답(JSON 배열)과 URL은 유지합니다.
# 기본 데이터에는 주소가 없어서 신규 역의 location은 "주소 미등록"으로 저장됩니다.
# 지도 표시는 주소 대신 WGS84 위도/경도를 사용합니다.
# 기존 역은 이름으로 연결하여 누락된 좌표와 노선만 보충합니다.
# StationRepository.updateStation은 기존 호출 호환성을 위해 좌표를 변경하지 않으며,
# REST Controller의 PUT은 save를 통해 좌표까지 변경합니다.
